name: CI
env:
  VITE_PUBLIC_SHARE_ORIGIN: ${{ vars.VITE_PUBLIC_SHARE_ORIGIN }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  conventions:
    name: Commit messages & version sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history so the PR/push range resolves; no secrets, no deps —
      # both scripts run on Node builtins + git only.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Version sync (root == mobile) + clean tree
        run: node scripts/check-version-sync.mjs
      - name: Commit-message convention over new commits
        # Prospective only: merge/revert/generated commits pass gracefully;
        # an unresolvable range (e.g. all-zero `before` on branch creation)
        # falls back to HEAD instead of failing the job.
        run: |
          BASELINE="scripts/commit-message-baseline.txt"
          if [[ -n "${{ github.base_ref }}" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=50 2>/dev/null || true
            node scripts/check-commit-messages.mjs --range "origin/${{ github.base_ref }}...HEAD" --baseline "$BASELINE"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" && -n "${{ github.event.before }}" ]]; then
            node scripts/check-commit-messages.mjs --range "${{ github.event.before }}...${{ github.sha }}" --baseline "$BASELINE" || \
              node scripts/check-commit-messages.mjs --count 1
          else
            node scripts/check-commit-messages.mjs --count 1
          fi

  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: completion-gate evidence cites main-ancestor SHAs
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package (types for api/mobile)
        run: npm run build -w @findback/shared
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Secret scan
        run: npm run scan:secrets
      - name: Dependency security baseline (deterministic CVE tripwire)
        # Fails offline if any installed copy regresses below a patched
        # version (CVE-2026-104852 @graphql-tools/utils, CVE-2026-96889 sharp).
        run: node scripts/check-security-baseline.mjs
      - name: Dependency audit (0 high / 0 critical)
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Completion ledger integrity gate
        # Keeps "green CI" from meaning "complete": fails on malformed ledger
        # state or an unallowlisted TODO/FIXME in shipped source (audit FBA-023/024).
        run: node scripts/completion-gate.mjs
      - name: Keyless map provider gate (no Google Maps/Places, MapLibre pin intact)
        run: node scripts/check-map-provider.mjs
      - name: API tests
        run: npm test -w @findback/api
      - name: Mobile tests
        run: npm test -w @findback/mobile
      - name: Release-infra script tests (signing, ABI, manifest, publish type)
        # Gates the release-script regressions (fingerprint parse order, ABI
        # completeness, full-SHA provenance, SemVer publish type) so an
        # unverified release path can never reach a tag. Also the commit-message
        # checker (range + enforcement baseline) and the AI release gate
        # itself (skeleton-tree detectors) — the gate test must run here
        # because these lists are explicit globs never match new files.
        run: node --test scripts/verify-release-apks.test.mjs scripts/generate-release-manifest.test.mjs scripts/derive-publish-type.test.mjs scripts/check-commit-messages.test.mjs scripts/ai-release-gate.test.mjs scripts/completion-gate.test.mjs scripts/check-security-baseline.test.mjs scripts/check-map-provider.test.mjs scripts/check-map-config.test.mjs
      - name: Sharing and server credential config tests
        run: node --test scripts/check-share-config.test.mjs scripts/check-mobile-build-config.test.mjs scripts/sync-fcm-secrets.test.mjs scripts/check-google-config.test.mjs scripts/check-signeddev-config.test.mjs scripts/check-web-association.test.mjs scripts/check-push-config.test.mjs scripts/deploy-required-edge-functions.test.mjs scripts/check-edge-parity.test.mjs scripts/check-sentry-release-parity.test.mjs scripts/check-qwen-bridge-contract.test.mjs
      - name: Cross-environment auth, KLIPY, cleanup, Sentry, matrix tests
        # New X-wave gates: browser-auth config contracts, the KLIPY key
        # wiring, the comment-media cleanup scheduler, the cross-lane Sentry
        # release proof, and the capability matrix invariants (X8/X18).
        run: node --test scripts/check-auth-config.test.mjs scripts/cross-environment-matrix.test.mjs scripts/cross-environment-closure.test.mjs scripts/check-klipy-config.test.mjs scripts/check-cleanup-scheduler.test.mjs scripts/sentry-cross-lane-proof.test.mjs
      - name: Build mobile web shell
        run: npm run build -w @findback/mobile
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  phone-verification-sql:
    name: Phone verification SQL behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      # Executes the migration's trigger logic against a real Postgres so the
      # phone-badge invariant is proven BEHAVIORALLY, not by grep. The vitest
      # companion remains only a static vocabulary guard.
      - name: Ensure psql client
        run: command -v psql >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - name: Apply harness + phone-verification migration
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          PG="psql -h localhost -U postgres -v ON_ERROR_STOP=1"
          $PG -c "create database findback_test;"
          $PG -d findback_test -f supabase/tests/_phone_verification_harness.sql
          $PG -d findback_test -f supabase/migrations/20261006120000_auth_phone_verification_sync.sql
      - name: Run behavioral phone-verification assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d findback_test -v ON_ERROR_STOP=1 -f supabase/tests/auth_phone_verification_sync.test.sql
      - name: Run static migration-parity suite
        run: node --test supabase/tests/migration_parity.test.mjs

  android:
    name: Android build & JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # Web/server Google OAuth client ID -> BuildConfig.GOOGLE_WEB_CLIENT_ID.
      # Public identifier; empty keeps Google sign-in fail-closed in the build.
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      # Full history: versionCode derives from `git rev-list --count HEAD`;
      # a depth-1 checkout would silently yield count=1 (see build.gradle guard).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK + CMake (findback_probe native lib)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - run: npm ci
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Strict Supabase preflight (installable build)
        run: node scripts/check-mobile-build-config.mjs --preflight
      - name: Strict Sentry DSN preflight (installable build)
        run: node scripts/check-sentry-config.mjs
        env:
          # Sentry is MANDATORY in installable APKs: this fails the job before
          # any build when the DSN is missing, malformed or a placeholder, so a
          # green CI run can never ship an unmonitored APK.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # M6: the CI debug APK must carry the SAME symbolicatable release identity the
      # signed release uploads sourcemaps for. Without this the SDK falls back to a
      # native-derived release (nativeRelease.id@version+build) that Sentry can never
      # symbolicate, and CI-APK crashes land in that bucket silently. The run body
      # below is BYTE-IDENTICAL to release.yml "Compute Sentry release identity" —
      # do not edit one without the other, or the two paths drift.
      - name: Compute Sentry release identity (S3 — keep byte-identical to release.yml)
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          SENTRY_RELEASE="findback-mobile@${VERSION}+${SHA}"
          # GITHUB_ENV applies to LATER steps only; export for the shape check
          # in THIS shell, then publish for the build + upload steps below.
          export SENTRY_RELEASE
          echo "SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          # VITE_* values in GITHUB_ENV are embedded by the Vite build below, so
          # the SDK `release` (via resolveSentryRelease, see
          # apps/mobile/src/services/monitoring/release.ts) is derived from the
          # exact same string passed to the sourcemap upload.
          echo "VITE_SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          node -e 'const r=process.env.SENTRY_RELEASE; if(!/^findback-mobile@\d+\.\d+\.\d+[-+0-9A-Za-z.]*\+[0-9a-f]{12}$/i.test(r)){console.error(`bad release identity: ${r}`);process.exit(1)} console.log(`release identity OK: ${r}`)'
      # SYNC-6/7: trace rate from repo variable VITE_SENTRY_TRACES_SAMPLE_RATE
      # (default 0.1, fail closed on garbage: non-numeric or outside 0..1).
      # Exports VITE_SENTRY_TRACES_SAMPLE_RATE + VITE_SENTRY_DIST for the build
      # below (dist android-debug pins CI crashes apart from releases).
      - name: Resolve Sentry traces sample rate (variable, default 0.1, fail closed)
        env:
          SENTRY_TRACES_RAW: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
        run: |
          RATE="${SENTRY_TRACES_RAW:-0.1}"
          export SENTRY_RATE="$RATE"
          node -e 'const r=Number(process.env.SENTRY_RATE); if(!Number.isFinite(r)||r<0||r>1){console.error(`bad traces sample rate: ${process.env.SENTRY_RATE} (want number in 0..1)`);process.exit(1)} console.log(`traces sample rate OK: ${r}`)'
          echo "VITE_SENTRY_TRACES_SAMPLE_RATE=${RATE}" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_DIST=android-debug" >> "$GITHUB_ENV"
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @findback/mobile
        env:
          # Sentry is MANDATORY in installable APKs (S1). Required GitHub Actions
          # VARIABLES (repo Settings → Secrets and variables → Actions → Variables):
          # VITE_SENTRY_DSN (real https DSN), SENTRY_ORG, SENTRY_PROJECT.
          # SENTRY_AUTH_TOKEN stays a CI secret for the sourcemap upload below —
          # never a VITE_* var, never in repo files. Unit tests / vite dev stay DSN-free.
          # VITE_SENTRY_TRACES_SAMPLE_RATE + VITE_SENTRY_DIST arrive via GITHUB_ENV
          # from the Resolve step above (variable-driven, not hardcoded).
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ci
          VITE_MONITORING_SELFTEST: "true"
          SENTRY_UPLOAD_SOURCEMAPS: "true"
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - name: Assert Supabase and Sentry embedded in bundle
        run: |
          node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets
          JS=$(ls apps/mobile/dist/assets/index-*.js | head -1)
          # M6: also assert the computed release identity reached the bundle, so a
          # CI debug APK can never silently fall back to the native-derived release
          # that Sentry cannot symbolicate. Mirrors release.yml's assertion.
          [ -n "${SENTRY_RELEASE:-}" ] || { echo "SENTRY_RELEASE was not computed — the Compute step above must run first"; exit 1; }
          grep -q "$SENTRY_RELEASE" "$JS" || { echo "Sentry release identity missing from built bundle"; exit 1; }
          echo "bundle carries required client config and Sentry release identity"
      # SYNC-7 device-proof dispatch path: a downloadable monitored APK MUST have
      # matching symbols in Sentry. This step runs ONLY on workflow_dispatch and
      # uploads this exact build's maps for dist android-debug BEFORE the APK
      # artifact below. It fails closed with an explicit message when the token,
      # org/project, release, or maps are missing — a dispatch run must NEVER
      # claim symbolicatable by release-exists alone.
      - name: Upload CI sourcemaps (device-proof path, dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || { echo "dispatch APK would be UN-SYMBOLICATABLE: SENTRY_AUTH_TOKEN secret is empty — add it in repo Settings → Secrets and variables → Actions → Secrets (owner action)"; exit 1; }
          [ -n "${SENTRY_ORG:-}" ] || { echo "dispatch APK would be UN-SYMBOLICATABLE: SENTRY_ORG variable is empty — add it in repo Settings → Variables"; exit 1; }
          [ -n "${SENTRY_PROJECT:-}" ] || { echo "dispatch APK would be UN-SYMBOLICATABLE: SENTRY_PROJECT variable is empty — add it in repo Settings → Variables"; exit 1; }
          [ -n "${SENTRY_RELEASE:-}" ] || { echo "dispatch APK would be UN-SYMBOLICATABLE: SENTRY_RELEASE was not computed — the Compute step above must run first"; exit 1; }
          MAPS=$(find apps/mobile/dist -name '*.map' | wc -l)
          [ "$MAPS" -gt 0 ] || { echo "dispatch APK would be UN-SYMBOLICATABLE: no .map files in apps/mobile/dist — the build must run with SENTRY_UPLOAD_SOURCEMAPS=true"; exit 1; }
          echo "uploading $MAPS sourcemap(s) for release ${SENTRY_RELEASE} dist android-debug (org/project from env)"
          npx -y @sentry/cli@3.8.0 sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$SENTRY_RELEASE" --dist android-debug apps/mobile/dist
      - name: Strip sourcemaps from packaged assets
        run: |
          find apps/mobile/dist -name '*.map' -delete
          REMAINING=$(find apps/mobile/dist -name '*.map' | wc -l)
          [ "$REMAINING" -eq 0 ] || { echo "$REMAINING .map file(s) remain after strip — refusing to package"; exit 1; }
          if grep -rIl 'sourceMappingURL' apps/mobile/dist/assets/ 2>/dev/null | grep -q .; then
            echo "sourceMappingURL reference remains in shipped bundle — refusing to package"; exit 1;
          fi
          echo "sourcemap strip verified: no .map files, no sourceMappingURL references in dist"
      - name: Capacitor sync
        run: npm run cap:sync -w @findback/mobile
      - name: Negative test — verifyBundledClientConfig fails on stale assets
        # Proves the packaging gate is not blind: stale one staged chunk, expect
        # the Gradle task to refuse packaging, then restore and expect success.
        # Runs on ephemeral CI only; the staged tree is restored before any build.
        run: |
          set -euo pipefail
          ASSETS=apps/mobile/android/app/src/main/assets/public/assets
          STALE_JS=$(ls "$ASSETS"/index-*.js | head -1)
          grep -q "supabase.co" "$STALE_JS" || { echo "staged bundle lacks the Supabase host — nothing to stale"; exit 1; }
          cp "$STALE_JS" /tmp/bundled-config-backup.js
          sed -i 's/supabase\.co/supabase.invalid/g' "$STALE_JS"
          if cd apps/mobile/android && ./gradlew :app:verifyBundledClientConfig; then
            echo "verifyBundledClientConfig passed on stale assets — gate is blind"; exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          cp /tmp/bundled-config-backup.js "$STALE_JS"
          grep -q "supabase.co" "$STALE_JS" || { echo "asset restore failed"; exit 1; }
          cd apps/mobile/android && ./gradlew :app:verifyBundledClientConfig
          echo "packaging gate refuses stale assets and accepts restored ones"
      - name: Android JVM tests + debug APK
        run: cd apps/mobile/android && ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Log versionName/versionCode
        run: cd apps/mobile/android && ./gradlew :app:printVersionInfo
      - name: Strict APK scan (DEX/assets secrets, forbidden weights, JNI, 16 KiB)
        run: npm run scan:apk -- --strict
      - name: Verify Supabase and Sentry in packaged debug APK
        run: node scripts/check-mobile-build-config.mjs --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # L5: without this the owner cannot install the verification artifact at all.
      # The monitoring self-test button is compiled into this APK (see
      # VITE_MONITORING_SELFTEST above), so the one synthetic event the Sentry proof
      # needs can only be sent from a build that is actually downloadable.
      - name: Record debug APK checksum
        run: |
          # Printed BEFORE upload so the checksum exists even if upload-artifact fails.
          # Hashes only — no key material, no DSN.
          sha256sum apps/mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Upload debug APK (device monitoring proof)
        # Manual device-validation runs only. Ordinary push/PR CI still builds,
        # JVM-tests, scans and checksums the APK, but MUST NOT create an
        # artifact: an unconditional per-push upload is exactly how the store
        # accumulated 133 artifacts / 13.46 GiB. No continue-on-error — a
        # requested device-artifact run should honestly fail if it cannot upload.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: findback-debug-apk-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # Short: this is a manual device-verification artifact, not a release.
          retention-days: 3

  docker:
    name: Docker build & health check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      SENTRY_TRACES_RAW: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Same deterministic release shape as the android/release/web lanes;
      # canonical owner apps/mobile/src/services/monitoring/release.ts.
      - name: Compute Sentry release identity (docker)
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          SENTRY_RELEASE="findback-mobile@${VERSION}+${SHA}"
          export SENTRY_RELEASE
          echo "SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          node -e 'const r=process.env.SENTRY_RELEASE; if(!/^findback-mobile@\d+\.\d+\.\d+[-+0-9A-Za-z.]*\+[0-9a-f]{12}$/i.test(r)){console.error(`bad release identity: ${r}`);process.exit(1)} console.log(`release identity OK: ${r}`)'
      - name: Resolve Sentry traces sample rate (docker, default 0.1, fail closed)
        run: |
          RATE="${SENTRY_TRACES_RAW:-0.1}"
          export SENTRY_RATE="$RATE"
          node -e 'const r=Number(process.env.SENTRY_RATE); if(!Number.isFinite(r)||r<0||r>1){console.error(`bad traces sample rate: ${process.env.SENTRY_RATE} (want number in 0..1)`);process.exit(1)} console.log(`traces sample rate OK: ${r}`)'
          echo "VITE_SENTRY_TRACES_SAMPLE_RATE=${RATE}" >> "$GITHUB_ENV"
      - name: Build image
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          docker build --build-arg VITE_SUPABASE_URL --build-arg VITE_SUPABASE_PUBLISHABLE_KEY --build-arg VITE_PUBLIC_SHARE_ORIGIN --build-arg VITE_SENTRY_DSN --build-arg VITE_SENTRY_ENVIRONMENT=production --build-arg VITE_SENTRY_TRACES_SAMPLE_RATE --build-arg VITE_SENTRY_RELEASE --build-arg VITE_SENTRY_DIST=docker-reference -t findback:ci .
      - name: Verify Supabase URL in packaged web shell
        run: |
          docker run --rm --env VITE_SUPABASE_URL --env VITE_SENTRY_DSN --entrypoint node findback:ci -e '
            const fs = require("node:fs");
            const dir = "/app/apps/mobile/dist/assets";
            const js = fs.readdirSync(dir).filter((name) => name.endsWith(".js"));
            if (!js.length || !js.some((name) => fs.readFileSync(`${dir}/${name}`, "utf8").includes(process.env.VITE_SUPABASE_URL))) {
              throw new Error("Supabase URL missing from Docker web shell");
            }
            console.log("Docker web shell carries Supabase URL");
            const dsn = (process.env.VITE_SENTRY_DSN || "").trim();
            if (dsn) {
              const host = new URL(dsn).hostname;
              if (!js.some((name) => fs.readFileSync(`${dir}/${name}`, "utf8").includes(host))) {
                throw new Error("Sentry DSN host missing from Docker web shell");
              }
              console.log("Docker web shell carries Sentry DSN host");
            } else {
              console.log("VITE_SENTRY_DSN empty — Sentry assert skipped (local empty-safe path)");
            }
          '
      - name: Run container
        run: docker run -d --name findback-ci -p 4000:4000 -e JWT_SECRET=ci-not-a-secret findback:ci
      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              echo "container healthy"
              curl -fsS http://localhost:4000/health
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs findback-ci
