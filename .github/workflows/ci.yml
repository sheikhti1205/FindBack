name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package (types for api/mobile)
        run: npm run build -w @findback/shared
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: API tests
        run: npm test -w @findback/api
      - name: Mobile tests
        run: npm test -w @findback/mobile
      - name: Build mobile web shell
        run: npm run build -w @findback/mobile
        env:
          CI: true

  docker:
    name: Docker build & health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t findback:ci .
      - name: Run container
        run: docker run -d --name findback-ci -p 4000:4000 -e JWT_SECRET=ci-not-a-secret findback:ci
      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              echo "container healthy"
              curl -fsS http://localhost:4000/health
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs findback-ci

