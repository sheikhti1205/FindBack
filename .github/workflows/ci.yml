name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build shared package (types for api/mobile)
        run: npm run build -w @findback/shared
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Secret scan
        run: npm run scan:secrets
      - name: API tests
        run: npm test -w @findback/api
      - name: Mobile tests
        run: npm test -w @findback/mobile
      - name: Build mobile web shell
        run: npm run build -w @findback/mobile
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  android:
    name: Android build & JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      # Full history: versionCode derives from `git rev-list --count HEAD`;
      # a depth-1 checkout would silently yield count=1 (see build.gradle guard).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Strict Supabase preflight (installable build)
        run: node scripts/check-mobile-build-config.mjs --preflight
      - name: Strict Sentry DSN preflight (installable build)
        run: node scripts/check-sentry-config.mjs
        env:
          # Sentry is MANDATORY in installable APKs: this fails the job before
          # any build when the DSN is missing, malformed or a placeholder, so a
          # green CI run can never ship an unmonitored APK.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # M6: the CI debug APK must carry the SAME symbolicatable release identity the
      # signed release uploads sourcemaps for. Without this the SDK falls back to a
      # native-derived release (nativeRelease.id@version+build) that Sentry can never
      # symbolicate, and CI-APK crashes land in that bucket silently. The run body
      # below is BYTE-IDENTICAL to release.yml "Compute Sentry release identity" —
      # do not edit one without the other, or the two paths drift.
      - name: Compute Sentry release identity (S3 — keep byte-identical to release.yml)
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          SENTRY_RELEASE="findback-mobile@${VERSION}+${SHA}"
          # GITHUB_ENV applies to LATER steps only; export for the shape check
          # in THIS shell, then publish for the build + upload steps below.
          export SENTRY_RELEASE
          echo "SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          # VITE_* values in GITHUB_ENV are embedded by the Vite build below, so
          # the SDK `release` (via resolveSentryRelease, see
          # apps/mobile/src/services/monitoring/release.ts) is derived from the
          # exact same string passed to the sourcemap upload.
          echo "VITE_SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          node -e 'const r=process.env.SENTRY_RELEASE; if(!/^findback-mobile@\d+\.\d+\.\d+[-+0-9A-Za-z.]*\+[0-9a-f]{7,40}$/i.test(r)){console.error(`bad release identity: ${r}`);process.exit(1)} console.log(`release identity OK: ${r}`)'
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @findback/mobile
        env:
          # Sentry is MANDATORY in installable APKs (S1). Required GitHub Actions
          # VARIABLES (repo Settings → Secrets and variables → Actions → Variables):
          # VITE_SENTRY_DSN (real https DSN), SENTRY_ORG, SENTRY_PROJECT.
          # SENTRY_AUTH_TOKEN stays a CI secret for the future sourcemap upload (S3) —
          # never a VITE_* var, never in repo files. Unit tests / vite dev stay DSN-free.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ci
          VITE_SENTRY_TRACES_SAMPLE_RATE: "0.1"
          VITE_MONITORING_SELFTEST: "true"
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - name: Assert Supabase and Sentry embedded in bundle
        run: |
          node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets
          JS=$(ls apps/mobile/dist/assets/index-*.js | head -1)
          # M6: also assert the computed release identity reached the bundle, so a
          # CI debug APK can never silently fall back to the native-derived release
          # that Sentry cannot symbolicate. Mirrors release.yml's assertion.
          [ -n "${SENTRY_RELEASE:-}" ] || { echo "SENTRY_RELEASE was not computed — the Compute step above must run first"; exit 1; }
          grep -q "$SENTRY_RELEASE" "$JS" || { echo "Sentry release identity missing from built bundle"; exit 1; }
          echo "bundle carries required client config and Sentry release identity"
      - name: Capacitor sync
        run: npm run cap:sync -w @findback/mobile
      - name: Android JVM tests + debug APK
        run: cd apps/mobile/android && ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Log versionName/versionCode
        run: cd apps/mobile/android && ./gradlew :app:printVersionInfo
      - name: Strict APK scan (DEX/assets secrets, forbidden weights, JNI, 16 KiB)
        run: npm run scan:apk -- --strict
      - name: Verify Supabase and Sentry in packaged debug APK
        run: node scripts/check-mobile-build-config.mjs --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # L5: without this the owner cannot install the verification artifact at all.
      # The monitoring self-test button is compiled into this APK (see
      # VITE_MONITORING_SELFTEST above), so the one synthetic event the Sentry proof
      # needs can only be sent from a build that is actually downloadable.
      - name: Record debug APK checksum
        run: |
          # Printed BEFORE upload so the checksum exists even if upload-artifact fails.
          # Hashes only — no key material, no DSN.
          sha256sum apps/mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Upload debug APK (device monitoring proof)
        uses: actions/upload-artifact@v4
        with:
          name: findback-debug-apk-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # Modest: this is a verification artifact, not a release. Long enough for
          # the owner to install it on a physical device, short enough that stale
          # debug APKs do not accumulate in the artifact store.
          retention-days: 14

  docker:
    name: Docker build & health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t findback:ci .
      - name: Run container
        run: docker run -d --name findback-ci -p 4000:4000 -e JWT_SECRET=ci-not-a-secret findback:ci
      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              echo "container healthy"
              curl -fsS http://localhost:4000/health
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          exit 1
      - name: Container logs
        if: always()
        run: docker logs findback-ci
