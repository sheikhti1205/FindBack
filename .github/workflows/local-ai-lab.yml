# FindBack — local-AI lab (WS-D).
#
# MANUAL-ONLY lab workflow. It is NEVER required: do NOT add it to branch
# protection, required status checks, or the release gate. It exists to
# document and re-assert the lab boundary:
#   * lab-only runtimes (mlc-llm, executorch, neuron) are benchmark harnesses
#     behind an explicit opt-in — never routable, never promotable, never
#     packaged into the production APK;
#   * LFM-licensed arms are eval-only catalogue entries (catalogOnly) and are
#     blocked on the bundle/download channels by the license gate.
# Trigger it deliberately from the Actions tab when lab policy needs proof.

name: Local AI — lab (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Lab-boundary proof (never required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Promotion policy proof (lab-only list enforced)
        run: node scripts/check-ai-promotion.mjs
      - name: Lab runtimes excluded from the production APK
        run: |
          cat <<'EOF'
          Lab boundary (informational — this job never gates releases):
            - mlc-llm, executorch, neuron: lab-only benchmark runtimes.
              Never routable, never promotable (promotionPolicy.ts).
              No native dependency for them may enter apps/mobile/android.
            - LFM-licensed arms (LFM Open License v1.0): eval-only catalogue
              entries (catalogOnly). Blocked on bundle/download channels
              (licenseGate.ts); lab evaluation downloads only.
            - The shipped APK carries at most the USE allowlist entry
              (assets/models/use/universal_sentence_encoder.tflite);
              enforced per-build by local-ai-model-smoke.yml.
          EOF
          for runtime in mlc-llm executorch neuron; do
            if grep -ri --include='*.gradle' --include='*.gradle.kts' --include='*.toml' -e "$runtime" apps/mobile/android; then
              echo "lab runtime reference in android build config: $runtime"; exit 1;
            fi
          done
          echo "lab-boundary proof OK: no lab-runtime native dependency in apps/mobile/android"
