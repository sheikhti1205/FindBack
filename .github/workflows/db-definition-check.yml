# TEMPORARY verification workflow (owner-requested: confirm the deployed function
# definition matches the committed migration and exercise the shared validation
# path). Read-only queries only; deleted immediately after the check.
name: DB definition check

on:
  workflow_dispatch:
    inputs:
      sql:
        description: "Read-only SQL to execute as postgres"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Run read-only query
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      SQL_INPUT: ${{ inputs.sql }}
    steps:
      - name: Query
        run: |
          node -e 'require("fs").writeFileSync("/tmp/q.json", JSON.stringify({ query: process.env.SQL_INPUT }))'
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "content-type: application/json" \
            --data @/tmp/q.json
