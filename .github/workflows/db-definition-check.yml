# TEMPORARY verification workflow (owner-requested step: confirm the deployed
# function definition matches the committed migration). Deleted immediately
# after the one read-only check.
name: DB definition check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read deployed findback_is_valid_calendar_date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Query pg_get_functiondef
        run: |
          cat > /tmp/q.json <<'JSON'
          {"query":"select pg_get_functiondef(p.oid) as def, p.prosecdef::text as secdef, array_to_json(p.proconfig)::text as config from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = 'findback_is_valid_calendar_date'"}
          JSON
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "content-type: application/json" \
            --data @/tmp/q.json
