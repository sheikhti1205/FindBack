name: Read-only Auth error diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findback-auth-diagnostics
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'sheikhti1205/FindBack' && github.ref == 'refs/heads/main' && github.actor == 'sheikhti1205' && github.triggering_actor == 'sheikhti1205'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Classify recent Auth failures without raw logs or personal data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/auth-error-diagnostics.mjs
