# FindBack — manual backend deploy (migrations + Edge Functions).
#
# Kept separate from both CI and the app release pipeline on purpose: backend
# mutations are explicit, one at a time, with live verification after each.
# Manual dispatch only — never on push, never on a tag.
#
# Required secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF (or the
# SUPABASE_PROJECT_REF variable), SUPABASE_DB_PASSWORD.
#
# Every `functions deploy` passes `--yes`: the runner has no TTY, and without it
# the CLI prints "Confirmation required … Nothing was changed" and exits 1, so a
# dispatched run looked like a deploy failure while production stayed untouched.
# After every run, verify live:
#   anon GET /rest/v1/users?select=*  -> 401
#   anon POST /rest/v1/rpc/is_username_available -> true/false boolean only

name: Backend deploy

on:
  workflow_dispatch:
    inputs:
      push_migrations:
        description: "Push pending supabase/migrations (db push)"
        type: boolean
        default: false
      deploy_push_dispatch:
        description: "Deploy the push-dispatch Edge Function"
        type: boolean
        default: false
      deploy_reply_comment:
        description: "Deploy the reply-comment Edge Function"
        type: boolean
        default: false
      deploy_cleanup_comment_media:
        description: "Deploy the cleanup-comment-media Edge Function"
        type: boolean
        default: false
      deploy_cleanup_report_media:
        description: "Deploy the cleanup-report-media Edge Function (P11 migrations required)"
        type: boolean
        default: false
      deploy_chat_wake:
        description: "Deploy the chat-wake Edge Function (P11 migrations required)"
        type: boolean
        default: false
      deploy_chat_media:
        description: "Deploy the chat-media gateway Edge Function"
        type: boolean
        default: false
      deploy_cleanup_chat_media:
        description: "Deploy the cleanup-chat-media sweeper Edge Function"
        type: boolean
        default: false
      deploy_copy_chat_evidence:
        description: "Deploy the copy-chat-evidence worker Edge Function"
        type: boolean
        default: false
      enable_leaked_password_protection:
        description: "Enable Auth leaked-password protection (requires eligible plan)"
        type: boolean
        default: false
      deploy_trust_maintenance:
        description: "Deploy the appeal expiry and report-evidence maintenance worker (M3 migrations required)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations + Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Push pending migrations
        if: inputs.push_migrations
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
      - name: Enable and verify leaked-password protection
        if: inputs.enable_leaked_password_protection
        run: node scripts/enable-leaked-password-protection.mjs
      - name: Deploy push-dispatch
        if: inputs.deploy_push_dispatch
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Server-to-server only: the function enforces its own
          # x-findback-dispatch-secret, so the gateway JWT check is redundant.
          supabase functions deploy push-dispatch --no-verify-jwt --yes
      - name: Deploy reply-comment
        if: inputs.deploy_reply_comment
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Server-to-server only: the device presents a single-use reply token,
          # not a Supabase session.
          supabase functions deploy reply-comment --no-verify-jwt --yes
      - name: Deploy cleanup-comment-media
        if: inputs.deploy_cleanup_comment_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper: canonical server auth:'secret' validates apikey;
          # gateway JWT verification must be OFF for backend secret API keys.
          # Deploy only after the chain through 20261102220000 is live
          # (private reservations + TTL purge + pending-status RPC).
          supabase functions deploy cleanup-comment-media --no-verify-jwt --yes
      - name: Deploy cleanup-report-media
        if: inputs.deploy_cleanup_report_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper only: the function enforces its own service-role /
          # x-cleanup-secret check. Deploy only after
          # 20261102120000_p11_authority_closure (queue + purge RPCs) is live.
          # Do not force-uninstall or vacuum; queued keys stay until storage
          # removal succeeds.
          supabase functions deploy cleanup-report-media --no-verify-jwt --yes
      - name: Deploy chat-wake
        if: inputs.deploy_chat_wake
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # The function verifies the caller's user JWT itself and then asks the
          # database whether that account sent the message; the gateway JWT
          # check would only duplicate that. Deploy only after
          # 20261102120000_p11_authority_closure (message-scoped claim) is live.
          supabase functions deploy chat-wake --no-verify-jwt --yes
      # NOTE: delete-account is intentionally NOT deployed by this workflow.
      # No delete-account pattern exists here or elsewhere in CI; it deploys
      # separately, owner-side, after explicit auth review.
      - name: Deploy chat-media
        if: inputs.deploy_chat_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # The gateway verifies the caller's Supabase user JWT itself and then
          # authorizes the attachment through the database; the gateway-level
          # JWT check would only duplicate that, and it cannot express the
          # service-owned delivery path. Deploy only after the chat media
          # authorization migrations are live.
          supabase functions deploy chat-media --no-verify-jwt --yes
      - name: Deploy cleanup-chat-media
        if: inputs.deploy_cleanup_chat_media
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal sweeper only: the canonical wrapper enforces the server
          # secret. No anonymous or user route may sweep private media.
          supabase functions deploy cleanup-chat-media --no-verify-jwt --yes
      - name: Deploy copy-chat-evidence
        if: inputs.deploy_copy_chat_evidence
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal moderation-evidence worker only: the canonical wrapper
          # enforces the server secret and claims work from the evidence queue.
          supabase functions deploy copy-chat-evidence --no-verify-jwt --yes
      - name: Deploy trust-maintenance
        if: inputs.deploy_trust_maintenance
        run: |
          supabase link --project-ref "$PROJECT_REF"
          # Internal secret-auth worker; only after accepted M3 migration rollout.
          supabase functions deploy trust-maintenance --no-verify-jwt --yes
