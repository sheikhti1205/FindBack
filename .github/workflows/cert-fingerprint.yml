# TEMPORARY diagnostic (owner-authorized): derive the release certificate
# SHA-256 fingerprint from the existing signing secrets. Prints ONLY the
# fingerprint line — never the keystore, passwords, alias, or private key.
# Removed from main immediately after the value is captured.
name: Release certificate fingerprint (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Decode keystore (never logged)
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Print SHA-256 certificate fingerprint only
        run: |
          set -euo pipefail
          FP="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep -iE '^[[:space:]]*SHA256:' | head -1 \
            | sed -E 's/^[^:]*:[[:space:]]*//')"
          [ -n "$FP" ] || { echo "could not read SHA256; check alias/password secrets"; exit 1; }
          echo "ANDROID_SIGNING_CERT_SHA256=${FP}"
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: Remove keystore material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
