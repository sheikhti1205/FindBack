# FindBack — retained search-helper / semantic-matching model smoke.
#
# Pinned-checksum smoke for the on-device model scope:
#   * fetch-use-model --check (pinned USE bytes + SHA-256)
#   * needle disabled-check (Needle fetch stays opt-in; no needle bytes land)
#   * retained lifecycle, extraction, matching and separate cloud Chat tests
#   * APK audit: no .litertlm/.gguf bytes except the USE allowlist entry
#     (assets/models/use/universal_sentence_encoder.tflite)
#
# This workflow explicitly downloads the pinned USE asset. The native workflow's
# Gradle preBuild can also acquire that same pinned bundle asset when absent.
# Neither workflow downloads Needle weights or any retired generative model.

name: Local intelligence — model smoke

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/src/services/ai/**"
      - "apps/mobile/src/services/appCapabilities.ts"
      - "apps/mobile/android/**"
      - "scripts/fetch-*-model.mjs"
      - "scripts/check-native-retirement*.mjs"
      - "scripts/check-model-notices*.mjs"
      - "scripts/scan-apk.mjs"
      - ".github/workflows/local-intelligence-models.yml"
  pull_request:
    paths:
      - "apps/mobile/src/services/ai/**"
      - "apps/mobile/src/services/appCapabilities.ts"
      - "apps/mobile/android/**"
      - "scripts/fetch-*-model.mjs"
      - "scripts/check-native-retirement*.mjs"
      - "scripts/check-model-notices*.mjs"
      - "scripts/scan-apk.mjs"
      - ".github/workflows/local-intelligence-models.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-smoke:
    name: Pinned checksum smoke + APK model-byte audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_PUBLIC_SHARE_ORIGIN: ${{ vars.VITE_PUBLIC_SHARE_ORIGIN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned NDK + CMake (Needle native helper)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - run: npm ci
      - name: Retained source ownership and legal snapshot integrity
        run: |
          node scripts/check-native-retirement.mjs
          node scripts/check-model-notices.mjs
          node --test --test-concurrency=1 scripts/check-native-retirement.test.mjs scripts/native-package-policy.test.mjs scripts/check-model-notices.test.mjs scripts/beta-claims.test.mjs
      - name: Local tools and separate cloud Chat behavioral regressions
        run: >-
          npx vitest run --root apps/mobile --maxWorkers=2
          src/services/ai/applicationAi.test.ts src/services/ai/retiredModelCleanup.test.ts
          src/services/ai/modelProfiles.test.ts src/services/ai/modelDescriptors.test.ts
          src/services/ai/download/bundle.test.ts src/services/ai/download/installer.test.ts
          src/services/ai/download/journal.test.ts
          src/services/ai/download/retiredImports.test.ts
          src/services/ai/needle/native.test.ts src/services/ai/needle/embedder.test.ts
          src/services/ai/orchestrator/route.test.ts src/services/ai/orchestrator/actionGate.test.ts
          src/services/ai/localOnly.test.ts src/services/liveNarrowTasks.test.ts
          src/services/liveNarrowTasks.transport.test.ts
          src/services/ai/aiPreferences.test.ts src/services/ai/aiPreferences.legacyKey.test.ts
          src/services/ai/cloudModelPreferences.test.ts
          src/services/possibleMatches.test.ts src/services/aiCredentials.test.ts
          src/services/ai/providerRegistry.test.ts src/services/ai/genericEndpoint.test.ts
          src/services/ai/chatController.test.ts src/services/ai/chatStore.test.ts
          src/services/ai/compaction.test.ts src/auth.accountSwitch.test.tsx
          src/screens/CreateReport.aiSuggest.test.tsx src/screens/SearchScreen.test.tsx
      - name: Fetch pinned USE asset (sole weight download on this path)
        run: node scripts/fetch-use-model.mjs
      - name: Pinned checksum smoke (verify, do not re-download)
        run: node scripts/fetch-use-model.mjs --check
      - name: Needle disabled-check (stays opt-in, no bytes land)
        run: |
          node scripts/fetch-needle-model.mjs --check
          test ! -d apps/mobile/android/app/src/main/assets/models/needle || { echo "needle asset present without opt-in"; exit 1; }
          test ! -f build/needle/needle3.cact || { echo "needle weights present without opt-in"; exit 1; }
          echo "needle disabled-check OK: no download, no asset"
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Build mobile web dist (Capacitor webDir)
        run: |
          node scripts/check-mobile-build-config.mjs --preflight
          npm run build -w @findback/mobile
          node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets
        env:
          CI: true
      - name: Capacitor sync
        run: npm run cap:sync -w @findback/mobile
      - name: Android JVM tests + debug APK
        run: cd apps/mobile/android && ./gradlew :app:testDebugUnitTest :app:assembleDebug --max-workers=2
      - name: Strict APK scan (USE allowlist, no retired JNI, per-ABI embedding JNI)
        run: npm run scan:apk -- --strict
      - name: Model-byte audit (no .litertlm/.gguf except the USE allowlist)
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ALLOW="assets/models/use/universal_sentence_encoder.tflite"
          LIST="$(unzip -Z1 "$APK")"
          if echo "$LIST" | grep -iE '\.(litertlm|gguf)$'; then echo "forbidden model bytes in APK"; exit 1; fi
          if echo "$LIST" | grep -iE '\.tflite$' | grep -v -x "$ALLOW"; then echo "non-allowlist .tflite bytes in APK"; exit 1; fi
          echo "$LIST" | grep -x "$ALLOW" || { echo "USE allowlist asset missing from APK"; exit 1; }
          echo "model-byte audit OK: only the USE allowlist entry ships"
