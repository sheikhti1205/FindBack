# FindBack — signed beta release build (per-ABI APKs + universal APK + AAB).
#
# TWO MODES:
#   workflow_dispatch = signed-candidate DRY path for owner testing. Runs the
#     full presign checks + release gate + build/sign/scan over every APK
#     variant, uploads Actions artifacts, and STOPS. It NEVER creates a
#     GitHub Release.
#   push of a v* tag = real release path. Validates tag == "v"+mobile version
#     exactly with the checkout pinned to the tagged commit, reruns the full
#     gate fresh on that commit, builds/signs/scans every APK variant,
#     writes checksums + release-manifest.json, then creates a GitHub Release
#     whose type is derived from the tag: any prerelease suffix (-beta.*,
#     -rc.*, -alpha) publishes as a PRE-RELEASE; only plain stable tags
#     (e.g. v1.0.0) publish as normal releases.
#
# This workflow file must be merged to the default branch BEFORE any v* tag
# is pushed; a tag built from a commit without this file is not a release.
# (Merging/tagging are owner actions — this change only provides the file.)
#
# Version policy: versions are ASSERTED, never bumped here. Root package.json
# version must equal apps/mobile/package.json version on every run; tag builds
# additionally require tag == "v"+mobile version and a clean tree. Any
# mismatch fails BEFORE signing.
#
# Required repo configuration:
#   Variables: VITE_SUPABASE_URL, VITE_SENTRY_DSN (real https DSN — Sentry is
#              MANDATORY in installable builds), SENTRY_ORG, SENTRY_PROJECT
#              (plain identifier strings for the future sourcemap upload step)
#   Secrets:   VITE_SUPABASE_PUBLISHABLE_KEY (secret — not a Variable — so its
#              value is masked in logs), SENTRY_AUTH_TOKEN (CI secret for the
#              future sourcemap upload — never a VITE_* var, never in repo files),
#              ANDROID_KEYSTORE_BASE64,
#              ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#              ANDROID_SIGNING_CERT_SHA256 (exact expected SHA-256 fingerprint
#              of the release certificate, hex with or without colons; pinned
#              on EVERY APK variant plus the AAB — values are never echoed)
#   Environment `release` (protection rules configured in repo settings).

name: Release
env:
  VITE_PUBLIC_SHARE_ORIGIN: ${{ vars.VITE_PUBLIC_SHARE_ORIGIN }}

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Default read-only. ONLY the `publish` job (tag builds) escalates to
# contents:write for the release creation — everything before it stays
# read-only so a compromised build step cannot publish.
permissions:
  contents: read

jobs:
  presign-checks:
    name: Version, tag & convention checks (fail before signing)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Version sync + tag/commit pinning + clean tree
        # Untagged (dispatch) runs assert root == mobile version and a clean
        # tree. Tag runs additionally assert tag == "v"+mobile version exactly
        # and HEAD == the tagged commit. Read-only; never bumps versions.
        run: node scripts/check-version-sync.mjs --ref "${{ github.ref }}"
      - name: Commit-message convention over the release range
        # Prospective only: merge/revert/generated commits pass gracefully, and
        # the enforcement baseline exempts pre-convention history that cannot be
        # rewritten (e.g. a merged commit whose body predates the Gates rule).
        run: |
          BASELINE="scripts/commit-message-baseline.txt"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            if [[ -n "$PREV" ]]; then
              node scripts/check-commit-messages.mjs --range "$PREV...$TAG" --baseline "$BASELINE"
            else
              node scripts/check-commit-messages.mjs --rev "$TAG" --baseline "$BASELINE"
            fi
          else
            node scripts/check-commit-messages.mjs --count 1
          fi
      - name: Completion gate (fail closed while any P0/P1 is open)
        # The audit's central failure was tagging a release while P0/P1 findings
        # and deferrals stayed open. This refuses to sign unless the completion
        # ledger is READY with every P0/P1 closed (audit FBA-023/024).
        run: node scripts/completion-gate.mjs --release

  gate:
    name: Full release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      # KLIPY (X7): the gate job bakes the same mobile web dist (Capacitor webDir)
      # as the signed build, so it carries the same adapter flag. Blank ->
      # disabled and the GIF control is hidden. Secret-only; never a literal.
      VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # Full messaging tests use native Web Locks (added in Node 24.5).
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Build shared package (types for api/mobile)
        run: npm run build -w @findback/shared
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Secret scan
        run: npm run scan:secrets
      - name: Dependency security baseline (deterministic CVE tripwire)
        run: node scripts/check-security-baseline.mjs
      - name: Dependency audit (0 high / 0 critical)
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Keyless map provider gate (no Google Maps/Places, MapLibre pin intact)
        run: node scripts/check-map-provider.mjs
      - name: API tests
        run: npm test -w @findback/api
      - name: Mobile tests
        run: npm test -w @findback/mobile
      - name: Release-infra script tests (signing, ABI, manifest, publish type)
        # Same suites CI gates; enforced here too so a tag build cannot sign
        # with a verifier that has drifted from the ABI/signing contract.
        run: node --test scripts/verify-release-apks.test.mjs scripts/generate-release-manifest.test.mjs scripts/derive-publish-type.test.mjs scripts/check-map-provider.test.mjs
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Strict installable-build config preflight
        run: node scripts/check-mobile-build-config.mjs --preflight && node scripts/check-sentry-config.mjs
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @findback/mobile
        env:
          CI: true
      - name: Assert client config in gate bundle
        run: node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets && node scripts/check-klipy-config.mjs --assets apps/mobile/dist/assets
      - name: Capacitor sync
        run: npm run cap:sync -w @findback/mobile
      - name: Install pinned NDK + CMake (findback_probe native lib)
        # The native VLM/probe build pins NDK 29.0.13113456 + CMake 3.31.6
        # (variables.gradle). A clean runner has no NDK and no accepted
        # licenses, so Gradle's auto-install fails closed without this. Keep
        # byte-identical to ci.yml / local-ai-native.yml.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Android JVM tests + debug APK
        run: cd apps/mobile/android && ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Assert client config in gate APK
        run: node scripts/check-mobile-build-config.mjs --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk && node scripts/check-klipy-config.mjs --apk apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      # Same deterministic release shape as the signed-build lane (mirrors
      # ci.yml's docker job): the reference image must bake the SAME release
      # identity so its config assert path matches instead of WARNING.
      - name: Compute Sentry release identity (gate docker)
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          SENTRY_RELEASE="findback-mobile@${VERSION}+${SHA}"
          export SENTRY_RELEASE
          echo "SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          node -e 'const r=process.env.SENTRY_RELEASE; if(!/^findback-mobile@\d+\.\d+\.\d+[-+0-9A-Za-z.]*\+[0-9a-f]{12}$/i.test(r)){console.error(`bad release identity: ${r}`);process.exit(1)} console.log(`release identity OK: ${r}`)'
      - name: Docker build & health check
        run: |
          # The Dockerfile's build stage runs `vite build` for apps/mobile, which
          # enforces the same fail-closed Supabase/Sentry preflight as every other
          # path. Without these build args the container build dies on the
          # preflight (unlike CI's docker job, which passes them). Values come
          # from the job env below; never hardcoded here.
          docker build --build-arg VITE_SUPABASE_URL --build-arg VITE_SUPABASE_PUBLISHABLE_KEY --build-arg VITE_PUBLIC_SHARE_ORIGIN --build-arg VITE_SENTRY_DSN --build-arg VITE_SENTRY_ENVIRONMENT=production --build-arg VITE_SENTRY_RELEASE --build-arg VITE_SENTRY_DIST=docker-reference -t findback:release-gate .
          docker run -d --name findback-gate -p 4000:4000 -e JWT_SECRET=ci-not-a-secret findback:release-gate
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs findback-gate || true
          exit 1
      - name: Container logs
        if: always()
        run: docker logs findback-gate 2>/dev/null || true

  signed-build:
    name: Signed APKs + AAB (+ manifest)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [presign-checks, gate]
    environment: release
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # KLIPY (X7): releases build the mobile web dist (Capacitor webDir) that is
      # packed into the APK, so bake the adapter flag here too. Blank -> disabled
      # and the GIF control is hidden. Secret-only; never a literal in repo files.
      VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
      # Sentry is MANDATORY in signed installable builds (S1). VITE_SENTRY_DSN and the
      # org/project identifiers come from repo Actions VARIABLES (never hardcoded);
      # SENTRY_AUTH_TOKEN stays a CI secret for the future sourcemap upload (S3) and
      # must never appear in repo files. The strict release preflight
      # (scripts/check-release-config.mjs) fails closed without a real DSN.
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      # Variable-driven (default resolved + validated in the Resolve step below;
      # empty var falls back to 0.1, garbage fails closed). Never hardcode here.
      VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.VITE_SENTRY_TRACES_SAMPLE_RATE }}
      VITE_SENTRY_DIST: android-release
      VITE_MONITORING_SELFTEST: ${{ vars.VITE_MONITORING_SELFTEST }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Web/server Google OAuth client ID -> BuildConfig.GOOGLE_WEB_CLIENT_ID.
      # Public identifier (NOT the client secret). Empty fails the hard
      # preflight above before signing; the packaged BuildConfig assert below
      # proves the non-empty value reached the APK.
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # SYNC-8: Google Web OAuth client ID is a HARD preflight failure (not a
      # warn). An empty or placeholder value stops the signed build before any
      # signing: shipping without the provider would silently drop Google
      # sign-in for every user. Public identifier only — shapes in logs.
      - name: Hard preflight — Google Web OAuth client ID (fail closed)
        run: |
          ID="${GOOGLE_WEB_CLIENT_ID:-}"
          case "$ID" in
            ""|-|x*|*placeholder*|*changeme*|*example*|test|dummy|null|undefined)
              echo "GOOGLE_WEB_CLIENT_ID is missing or a placeholder — refusing to sign (owner action: set the repo Actions variable)"; exit 1 ;;
          esac
          case "$ID" in
            *.apps.googleusercontent.com) echo "Google Web OAuth client ID present (suffix .apps.googleusercontent.com)" ;;
            *) echo "GOOGLE_WEB_CLIENT_ID does not look like a Google OAuth client ID (want *.apps.googleusercontent.com) — refusing to sign"; exit 1 ;;
          esac
      - name: Strict release config preflight
        run: node scripts/check-release-config.mjs
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Build shared package
        run: npm run build -w @findback/shared
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Compute Sentry release identity (S3)
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SHA=$(git rev-parse --short=12 HEAD)
          SENTRY_RELEASE="findback-mobile@${VERSION}+${SHA}"
          # GITHUB_ENV applies to LATER steps only; export for the shape check
          # in THIS shell, then publish for the build + upload steps below.
          export SENTRY_RELEASE
          echo "SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          # VITE_* values in GITHUB_ENV are embedded by the Vite build below, so
          # the SDK `release` (via resolveSentryRelease, see
          # apps/mobile/src/services/monitoring/release.ts) is derived from the
          # exact same string passed to the sourcemap upload.
          echo "VITE_SENTRY_RELEASE=${SENTRY_RELEASE}" >> "$GITHUB_ENV"
          node -e 'const r=process.env.SENTRY_RELEASE; if(!/^findback-mobile@\d+\.\d+\.\d+[-+0-9A-Za-z.]*\+[0-9a-f]{12}$/i.test(r)){console.error(`bad release identity: ${r}`);process.exit(1)} console.log(`release identity OK: ${r}`)'
      # SYNC-6: canonicalize the variable-driven trace rate (empty -> 0.1) and
      # fail closed on garbage (non-numeric or outside 0..1). Re-export covers
      # an empty repo variable (job env would otherwise bake an empty string).
      - name: Resolve Sentry traces sample rate (variable, default 0.1, fail closed)
        run: |
          RATE="${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}"
          export SENTRY_RATE="$RATE"
          node -e 'const r=Number(process.env.SENTRY_RATE); if(!Number.isFinite(r)||r<0||r>1){console.error(`bad traces sample rate: ${process.env.SENTRY_RATE} (want number in 0..1)`);process.exit(1)} console.log(`traces sample rate OK: ${r}`)'
          echo "VITE_SENTRY_TRACES_SAMPLE_RATE=${RATE}" >> "$GITHUB_ENV"
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @findback/mobile
        env:
          CI: true
          # S3 companion: opt in to hidden-sourcemap emission for this build ONLY.
          # Local builds omit it and emit no .map files at all. (S1 owns the rest
          # of this step's env; coordinator confirmation noted in S3.log.md.)
          SENTRY_UPLOAD_SOURCEMAPS: "true"
      - name: Assert Supabase and Sentry in release bundle
        run: node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets && node scripts/check-klipy-config.mjs --assets apps/mobile/dist/assets
      - name: Assert baked client config (no placeholders, no secrets)
        run: |
          JS=$(ls apps/mobile/dist/assets/index-*.js | head -1)
          # The publishable key must appear baked into the bundle…
          grep -c 'sb_publishable_' "$JS" | grep -qE '^[1-9]' || { echo "publishable key missing from bundle"; exit 1; }
          # …and the "-" placeholder from run 35531815290 must never recur.
          if grep -q 'supabase\.co[^"]*","-"' "$JS"; then echo "placeholder key baked into bundle"; exit 1; fi
          # Sentry is MANDATORY in installable builds: assert the real DSN host
          # (and the baked release identity) actually landed in the shipped bundle,
          # so a green build can never ship unmonitored. Shapes only, never the key.
          DSN_HOST=$(node -e "import('./scripts/check-sentry-config.mjs').then(m=>{const r=m.checkEffectiveSentryDsn({mode:'production'});if(!r.ok){console.error('DSN '+r.reason);process.exit(1)}process.stdout.write(r.host)})")
          grep -q "$DSN_HOST" "$JS" || { echo "Sentry DSN host missing from built bundle"; exit 1; }
          grep -q "$SENTRY_RELEASE" "$JS" || { echo "Sentry release identity missing from built bundle"; exit 1; }
          # Only counts/shapes are echoed — never key material.
          echo "bundle config assertion passed ($(basename "$JS"); sentry host $DSN_HOST; release $SENTRY_RELEASE)"
      - name: Upload sourcemaps to Sentry (S3)
        env:
          # Secrets-only auth: the token is owner-held in repo Settings → Secrets
          # and variables → Actions → Secrets, never in repo files, never VITE_*.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SENTRY_AUTH_TOKEN:-}" ] || { echo "SENTRY_AUTH_TOKEN secret is empty — add it in repo Settings → Secrets and variables → Actions → Secrets (owner action)"; exit 1; }
          [ -n "${SENTRY_ORG:-}" ] || { echo "SENTRY_ORG variable is empty — add it in repo Settings → Variables"; exit 1; }
          [ -n "${SENTRY_PROJECT:-}" ] || { echo "SENTRY_PROJECT variable is empty — add it in repo Settings → Variables"; exit 1; }
          [ -n "${SENTRY_RELEASE:-}" ] || { echo "SENTRY_RELEASE was not computed — the Compute step above must run first"; exit 1; }
          MAPS=$(find apps/mobile/dist -name '*.map' | wc -l)
          [ "$MAPS" -gt 0 ] || { echo "no .map files in apps/mobile/dist — the build must run with SENTRY_UPLOAD_SOURCEMAPS=true"; exit 1; }
          # Any upload failure fails this job visibly: a release MUST NOT ship
          # with an SDK release that Sentry cannot symbolicate.
          echo "uploading $MAPS sourcemap(s) for release ${SENTRY_RELEASE} (org/project from job env)"
          # M5: EXACT pin, not a floating major. A `project:releases` token is in this
          # step's environment, so the code npx fetches must not be able to change
          # between two runs of the same commit. Verified to exist via
          # `npm view @sentry/cli@3.8.0 version` (2026-09-26). Bump deliberately.
          # dist android-release pins release crashes apart from CI (android-debug)
          # and web (web-production) symbols for the same release string.
          npx -y @sentry/cli@3.8.0 sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$SENTRY_RELEASE" --dist android-release apps/mobile/dist
      - name: Strip sourcemaps from distributed assets (S3)
        run: |
          find apps/mobile/dist -name '*.map' -delete
          REMAINING=$(find apps/mobile/dist -name '*.map' | wc -l)
          [ "$REMAINING" -eq 0 ] || { echo "$REMAINING .map file(s) remain after strip — refusing to package"; exit 1; }
          if grep -rIl 'sourceMappingURL' apps/mobile/dist/assets/ 2>/dev/null | grep -q .; then
            echo "sourceMappingURL reference remains in shipped bundle — refusing to package"; exit 1;
          fi
          echo "sourcemap strip verified: no .map files, no sourceMappingURL references in dist"
      - name: Capacitor sync
        run: npm run cap:sync -w @findback/mobile
      - name: Install pinned NDK + CMake (findback_probe native lib)
        # Same pinned toolchain as the gate/CI: the signed build links the
        # native probe/VLM libraries, so a clean runner must have NDK
        # 29.0.13113456 + CMake 3.31.6 with accepted licenses.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Restore release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
      - name: Signed assembleRelease + bundleRelease (per-ABI + universal APKs, AAB)
        run: cd apps/mobile/android && ./gradlew :app:assembleRelease :app:bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Remove keystore material
        if: always()
        run: rm -f "${{ runner.temp }}/findback-release.jks"
      - name: Verify EVERY APK variant (signature pin, identity, ABI, secrets, config)
        # Any failure here blocks the release. Fingerprint values are never
        # echoed — the script prints match/mismatch only.
        # EXPECTED_VERSION_NAME/CODE are exported in-shell (derived, not
        # duplicated): versionName from apps/mobile/package.json, versionCode
        # from the same 100000 + commit-count formula build.gradle uses.
        run: |
          export EXPECTED_VERSION_NAME="$(node -p "require('./apps/mobile/package.json').version")"
          export EXPECTED_VERSION_CODE="$((100000 + $(git rev-list --count HEAD)))"
          bash scripts/verify-release-apks.sh \
            --apk-dir apps/mobile/android/app/build/outputs/apk/release \
            --aab apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          EXPECTED_APP_ID: com.findback.app
      # SYNC-8 companion: prove the hard-preflighted GOOGLE_WEB_CLIENT_ID reached
      # the packaged APK (BuildConfig.GOOGLE_WEB_CLIENT_ID non-empty). Fails
      # closed when the staged APKs do not embed the exact configured value.
      # Public identifier only — the value itself is never echoed.
      - name: Assert packaged Google Web OAuth client ID non-empty
        run: |
          set -euo pipefail
          [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ] || { echo "GOOGLE_WEB_CLIENT_ID empty at assert time — hard preflight above must run first"; exit 1; }
          MATCHED=0
          for APK in release-stage/*.apk; do
            TMPDIR_APK=$(mktemp -d)
            unzip -q "$APK" 'classes*.dex' -d "$TMPDIR_APK"
            if strings "$TMPDIR_APK"/classes*.dex | grep -qF "$GOOGLE_WEB_CLIENT_ID"; then
              echo "BuildConfig client ID present in $(basename "$APK")"
              MATCHED=$((MATCHED+1))
            else
              echo "BuildConfig GOOGLE_WEB_CLIENT_ID missing from $(basename "$APK") — refusing to publish"; exit 1
            fi
            rm -rf "$TMPDIR_APK"
          done
          [ "$MATCHED" -gt 0 ] || { echo "no APKs checked for BuildConfig client ID"; exit 1; }
      - name: Record artifact sizes (R8 still OFF)
        # Size-measurement hook only: minifyEnabled/shrinkResources stay false
        # (enabling R8 is a separate future change with its own before/after
        # comparison). Sizes land in release-manifest.json `bytes` fields.
        run: |
          ls -l apps/mobile/android/app/build/outputs/apk/release/*.apk \
                apps/mobile/android/app/build/outputs/bundle/release/*.aab
          du -b apps/mobile/android/app/build/outputs/apk/release/*.apk \
                apps/mobile/android/app/build/outputs/bundle/release/*.aab
      - name: Stage release files (friendly names, flat dir)
        # Gradle split names (app-<abi>-release.apk, app-universal-release.apk)
        # become FindBack-<TAG>-<abi|universal>.apk so the Release page and the
        # manifest agree. Unexpected APK names fail closed here.
        run: |
          OUT=apps/mobile/android/app/build/outputs
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="dispatch-${GITHUB_SHA:0:12}"; fi
          echo "ART_TAG=$TAG" >> "$GITHUB_ENV"
          rm -rf release-stage && mkdir -p release-stage
          for APK in "$OUT"/apk/release/*.apk; do
            BASE="$(basename "$APK")"
            case "$BASE" in
              app-arm64-v8a-release.apk)     DEST="FindBack-${TAG}-arm64-v8a.apk" ;;
              app-armeabi-v7a-release.apk)   DEST="FindBack-${TAG}-armeabi-v7a.apk" ;;
              app-x86_64-release.apk)        DEST="FindBack-${TAG}-x86_64.apk" ;;
              app-universal-release.apk)     DEST="FindBack-${TAG}-universal.apk" ;;
              *) echo "unexpected release APK name: $BASE" >&2; exit 1 ;;
            esac
            cp "$APK" "release-stage/$DEST"
          done
          cp "$OUT/bundle/release/app-release.aab" "release-stage/FindBack-${TAG}.aab"
          ls -l release-stage/
      - name: Checksums + release-manifest.json
        run: |
          MIN_SDK=$(grep -E '^\s*minSdkVersion' apps/mobile/android/variables.gradle | grep -oE '[0-9]+')
          TARGET_SDK=$(grep -E '^\s*targetSdkVersion' apps/mobile/android/variables.gradle | grep -oE '[0-9]+')
          VCODE=$((100000 + $(git rev-list --count HEAD)))
          SHA=$(git rev-parse HEAD)
          node scripts/generate-release-manifest.mjs \
            --tag "$ART_TAG" \
            --apk-dir release-stage \
            --aab "release-stage/FindBack-${ART_TAG}.aab" \
            --version-code "$VCODE" \
            --git-sha "$SHA" \
            --min-sdk "$MIN_SDK" \
            --target-sdk "$TARGET_SDK" \
            --out release-stage/release-manifest.json
          cat release-stage/release-manifest.json
          (cd release-stage && sha256sum *.apk *.aab release-manifest.json > SHA256SUMS.txt)
          cat release-stage/SHA256SUMS.txt
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: findback-signed-${{ github.run_id }}
          path: release-stage/
          # Temporary inter-job transport consumed by the publish job in this
          # same run. 3 days is enough to retry a failed release; the published
          # GitHub Release assets are separate and unaffected.
          retention-days: 3

  publish:
    name: Publish release (tag builds only)
    # The ONLY job with write permission, and it runs ONLY for v* tags after
    # every variant passed verification. workflow_dispatch stops at artifacts.
    # Publish TYPE is derived from the tag's SemVer (R4): any prerelease suffix
    # (-beta.*/-rc.*/-alpha) publishes as a PRE-RELEASE; only plain stable tags
    # publish as normal releases with a stable title.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: signed-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: findback-signed-${{ github.run_id }}
          path: release-files
      - name: Create GitHub Release (type derived from tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ls -l release-files/
          (cd release-files && sha256sum -c SHA256SUMS.txt)
          TITLE="$(node scripts/derive-publish-type.mjs --tag "$TAG" --field title)"
          FLAG="$(node scripts/derive-publish-type.mjs --tag "$TAG" --field prerelease-flag)"
          # Curated notes win: a committed docs/release-notes/<tag>.md is the
          # authoritative changelog for that release; otherwise use the derived
          # generic notes.
          NOTES_FILE="docs/release-notes/${TAG}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES_ARG=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARG=(--notes "$(node scripts/derive-publish-type.mjs --tag "$TAG" --field notes)")
          fi
          # Intentional word-splitting: FLAG is empty (stable) or --prerelease.
          # shellcheck disable=SC2086
          gh release create "$TAG" $FLAG \
            --title "$TITLE" \
            "${NOTES_ARG[@]}" \
            release-files/*.apk release-files/*.aab release-files/release-manifest.json release-files/SHA256SUMS.txt
