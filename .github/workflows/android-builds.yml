# Signed Android publication after successful main CI. Release tags are exactly
# v<app version>, never a rolling alias. Numbered tags and assets are immutable:
# a changed source commit requires a new app version, not replacement binaries.
# The public metadata bridge discovers numbered releases for in-app updates.

name: Android builds

on:
  # Owner testing only: signed Actions artifacts, never a Release/catalogue.
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# One publisher at a time, never cancelled mid-upload: a half-replaced release
# would leave a catalogue pointing at missing bytes.
concurrency:
  group: android-publish
  cancel-in-progress: false
  # Keep successful pushes waiting rather than replacing the previous pending
  # build. GitHub permits up to 100 pending runs in this queue.
  queue: max

env:
  VITE_PUBLIC_SHARE_ORIGIN: ${{ vars.VITE_PUBLIC_SHARE_ORIGIN }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  VITE_SENTRY_ENVIRONMENT: production
  VITE_SENTRY_DIST: android-release
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

jobs:
  guard:
    # A numbered release is immutable, so a commit that reuses an already
    # published version has nothing to publish. Decide that cheaply here and
    # skip the 45-minute build instead of failing it: "same version, already
    # released" is a normal state, not a build error.
    name: Decide whether this commit needs a release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          TAG="v${VERSION}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PUBLISHED_SHA=""
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            PUBLISHED_SHA=$(git rev-parse "${TAG}^{commit}")
          elif RELEASE_SHA=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish 2>/dev/null); then
            PUBLISHED_SHA="$RELEASE_SHA"
          fi
          if [ -n "$PUBLISHED_SHA" ] && [ "$PUBLISHED_SHA" != "$SHA" ]; then
            echo "::warning::${TAG} is already published from ${PUBLISHED_SHA}. Bump the app version to publish ${SHA}; nothing was changed."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  apk:
    needs: guard
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && needs.guard.outputs.publish == 'true')
    name: Signed APKs + catalogue
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Refuse to build without the server URL and publishable key
        # Hard rule: an APK that cannot reach the server is a build failure, not
        # a warning. Publishable key only — never a service/secret key.
        run: |
          set -euo pipefail
          [ -n "${VITE_SUPABASE_URL:-}" ] || { echo "VITE_SUPABASE_URL is empty"; exit 1; }
          case "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" in
            "") echo "VITE_SUPABASE_PUBLISHABLE_KEY is empty"; exit 1 ;;
            sb_secret_*|*service_role*) echo "a secret key must never be baked into a client build"; exit 1 ;;
          esac
          echo "server URL and publishable key present"

      - run: npm ci
      - name: Build shared package
        run: npm run build -w @norfold/shared
      - name: Restore Firebase Android client configuration
        run: node scripts/materialize-google-services.mjs
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - name: Strict installable config and build identity
        run: |
          node scripts/check-release-config.mjs
          SHA=$(git rev-parse HEAD)
          export BUILD_SHA="$SHA"
          echo "BUILD_SHA=$SHA" >> "$GITHUB_ENV"
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          node scripts/check-version-sync.mjs
          TAG="v${VERSION}"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
          if gh release view "$TAG" --json isDraft,targetCommitish > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            node -e 'const r=require(process.argv[1]); if(r.isDraft && r.targetCommitish!==process.env.BUILD_SHA) process.exit(1)' "$RUNNER_TEMP/existing-release.json" || {
              echo '::error::A draft for this version belongs to another source commit.'; exit 1;
            }
          fi
          if git rev-parse --verify -q "${TAG}^{commit}" >/dev/null; then
            [ "$(git rev-parse "${TAG}^{commit}")" = "$SHA" ] || {
              echo "::error::${TAG} already belongs to another commit. Advance the app version; numbered releases are immutable."
              exit 1
            }
          fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=findback-mobile@${VERSION}+${SHA:0:12}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fetch pinned USE asset
        run: node scripts/fetch-use-model.mjs
      - name: Build mobile web dist (Capacitor webDir)
        run: npm run build -w @norfold/mobile
        env:
          CI: true
          SENTRY_UPLOAD_SOURCEMAPS: "true"
      - name: Assert client config in the bundle
        run: node scripts/check-mobile-build-config.mjs --assets apps/mobile/dist/assets
      - name: Upload matching symbols and remove maps before packaging
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]
          npx -y @sentry/cli@3.8.0 sourcemaps upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" --release "$VITE_SENTRY_RELEASE" --dist "$VITE_SENTRY_DIST" apps/mobile/dist
          find apps/mobile/dist -name '*.map' -delete
      - name: Capacitor sync
        run: npm run cap:sync -w @norfold/mobile
      - name: Install pinned NDK + CMake (findback_probe native lib)
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Restore release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
      - name: Signed assembleRelease (per-ABI APKs)
        run: cd apps/mobile/android && ./gradlew --max-workers=2 :app:assembleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/findback-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Remove keystore material
        if: always()
        run: rm -f "${{ runner.temp }}/findback-release.jks"

      - name: Verify EVERY APK variant (signature pin, identity, ABI, config)
        run: |
          export EXPECTED_VERSION_NAME="$(node -p "require('./apps/mobile/package.json').version")"
          export EXPECTED_VERSION_CODE="$((100000 + $(git rev-list --count HEAD)))"
          bash scripts/verify-release-apks.sh \
            --apk-dir apps/mobile/android/app/build/outputs/apk/release \
            --facts-out "$RUNNER_TEMP/apk-facts.json"
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          EXPECTED_APP_ID: com.findback.app

      - name: Stage APKs under their published names
        run: |
          set -euo pipefail
          SHA12="${BUILD_SHA:0:12}"
          echo "SHA12=$SHA12" >> "$GITHUB_ENV"
          rm -rf release-stage && mkdir -p release-stage
          for APK in apps/mobile/android/app/build/outputs/apk/release/*.apk; do
            BASE="$(basename "$APK")"
            case "$BASE" in
              app-arm64-v8a-release.apk)   ABI="arm64-v8a" ;;
              app-armeabi-v7a-release.apk) ABI="armeabi-v7a" ;;
              app-x86_64-release.apk)      ABI="x86_64" ;;
              app-universal-release.apk)  ABI="universal" ;;
              *) echo "unexpected release APK: $BASE"; exit 1 ;;
            esac
            cp "$APK" "release-stage/Norfold-${SHA12}-${ABI}.apk"
          done
          ls -l release-stage/

      - name: Write the update catalogue for exactly these bytes
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/mobile/package.json').version")"
          VCODE=$((100000 + $(git rev-list --count HEAD)))
          SUBJECT="$(git log -1 --pretty=%s)"
          RECENT="$(git log -3 --pretty=%s | paste -sd ';' - | cut -c1-280)"
          PRIOR=()
          PREVIOUS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" --jq 'map(select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$")) and any(.assets[]; .name == "catalogue.v1.json"))) | .[0].tag_name // empty')
          if [ -n "$PREVIOUS" ]; then
            gh release download "$PREVIOUS" --pattern catalogue.v1.json --output "$RUNNER_TEMP/prior-catalogue.json"
            PRIOR=(--previous "$RUNNER_TEMP/prior-catalogue.json")
          fi
          node scripts/write-android-catalogue.mjs \
            "${PRIOR[@]}" \
            --facts "$RUNNER_TEMP/apk-facts.json" \
            --apk-dir release-stage \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "$RELEASE_TAG" \
            --release-id "$RELEASE_TAG" \
            --version-name "$VERSION" \
            --version-code "$VCODE" \
            --git-sha "${BUILD_SHA}" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --summary "${SUBJECT}. Recent changes: ${RECENT}" \
            --signing-channel beta \
            --out release-stage/catalogue.v1.json
          node -e 'const c=require("./release-stage/catalogue.v1.json"); console.log(`catalogue: ${c.releases[0].id} versionCode ${c.releases[0].versionCode} artifacts ${c.releases[0].artifacts.length}`)'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish the numbered release
        if: github.event_name != 'workflow_dispatch'
        # APKs first, catalogue last: a reader must never see a catalogue entry
        # whose bytes are not uploaded yet. Never replace a numbered release.
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false ]; then
              echo "${RELEASE_TAG} is already published; preserving its immutable assets."
              exit 0
            fi
          else
            TYPE=()
            case "$RELEASE_TAG" in *-*) TYPE=(--prerelease) ;; esac
            gh release create "$RELEASE_TAG" --draft "${TYPE[@]}" --target "$BUILD_SHA" \
              --title "Norfold $RELEASE_TAG" --notes "Signed Android build. Changes are included in the in-app update history."
          fi
          # Replacement is permitted only inside this unpublished draft, so a
          # failed upload can resume. Published versioned bytes never change.
          gh release upload "$RELEASE_TAG" release-stage/Norfold-*.apk --clobber
          gh release upload "$RELEASE_TAG" release-stage/catalogue.v1.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | "published \(.name) \(.size) bytes"'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Preserve the signed test candidate without publishing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: norfold-chat-candidate-${{ github.sha }}
          path: release-stage/Norfold-*.apk
          if-no-files-found: error
          retention-days: 7
