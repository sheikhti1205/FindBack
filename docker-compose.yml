services:
  api:
    build:
      context: .
      # Empty-safe forwarding: unset vars build a local UNMONITORED shell (the
      # Dockerfile verification logs an explicit warning); reference/monitored
      # builds export the Sentry vars before `docker compose build`.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_PUBLIC_SHARE_ORIGIN: ${VITE_PUBLIC_SHARE_ORIGIN:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${VITE_SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        VITE_SENTRY_DIST: ${VITE_SENTRY_DIST:-docker-reference}
    image: findback:local
    container_name: findback-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PUBLIC_URL: http://localhost:4000
      # Optional: point /ai/help at any OpenAI-compatible endpoint.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    volumes:
      - findback-data:/app/data
      - findback-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  findback-data:
  findback-uploads:
