apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def appVersionName() {
    def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
    def version = pkg.version?.toString()
    if (version == null || !(version ==~ /\d+\.\d+\.\d+.*/)) {
        throw new GradleException("apps/mobile/package.json must carry a SemVer version, found: ${version}")
    }
    return version
}

def gitVersionCode() {
    def override = System.getenv("VERSION_CODE_OVERRIDE")
    if (override != null && override.trim().isInteger()) {
        return override.trim().toInteger()
    }
    // A shallow checkout (e.g. Actions depth=1) does NOT fail rev-list — it
    // silently returns ~1. Refuse to mint a wrong versionCode from it.
    def repoGitDir = new File(rootProject.projectDir, "../../.git").getCanonicalFile()
    if (new File(repoGitDir, "shallow").exists()) {
        throw new GradleException(
            "Shallow git checkout detected (.git/shallow exists): " +
            "rev-list --count would be wrong. Fetch full history " +
            "(fetch-depth: 0) or set VERSION_CODE_OVERRIDE."
        )
    }
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-list", "--count", "HEAD"
            standardOutput = out
            workingDir = rootProject.projectDir
        }
        return 100000 + out.toString().trim().toInteger()
    } catch (Exception e) {
        throw new GradleException(
            "Cannot derive versionCode from git history (shallow clone?). " +
            "Set VERSION_CODE_OVERRIDE or fetch full history. Cause: ${e.message}"
        )
    }
}

def gitCommitSha() {
    def override = System.getenv("GIT_SHA_OVERRIDE")
    if (override != null && !override.trim().isEmpty()) {
        return override.trim()
    }
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine "git", "rev-parse", "--short=12", "HEAD"
            standardOutput = out
            workingDir = rootProject.projectDir
        }
        return out.toString().trim()
    } catch (Exception e) {
        return "unknown"
    }
}

def shareLinkHostname() {
    def out = new ByteArrayOutputStream()
    exec {
        commandLine "node", new File(rootProject.projectDir, "../../../scripts/check-share-config.mjs").canonicalPath, "--hostname"
        standardOutput = out
    }
    return out.toString().trim()
}

// FBX-025: signeddev may ONLY carry the canonical findbackRelease signer.
// Presence-only check over the four existing ANDROID_KEYSTORE_* names — the
// values themselves are never read into a log, a message, or a handoff.
def signeddevSigningReady() {
    return ["ANDROID_KEYSTORE_PATH", "ANDROID_KEYSTORE_PASSWORD",
            "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"].every { name ->
        def value = System.getenv(name)
        return value != null && !value.trim().isEmpty()
    }
}

// Keyless map style (MAP pivot): the MapLibre-compatible style URL the native
// picker/viewer/snapshotter render. Canonical local env name
// FINDBACK_MAP_STYLE_URL; default is the owner-decided OpenFreeMap Liberty
// style. This is NON-SECRET provider config (a public style endpoint), never
// a credential — safe to ship in BuildConfig and safe to log. Switching
// providers means changing this URL only; no picker logic changes.
def findbackMapStyleUrl() {
    def url = System.getenv("FINDBACK_MAP_STYLE_URL") ?: "https://tiles.openfreemap.org/styles/liberty"
    return url.trim()
}

// Public contact for the Nominatim User-Agent (usage policy requires an
// identifying contact). Canonical local env name FINDBACK_MAP_CONTACT;
// default is the app's public site. NON-SECRET — safe to ship and log.
def findbackMapContact() {
    def contact = System.getenv("FINDBACK_MAP_CONTACT") ?: "https://findbackapp.social"
    return contact.trim()
}

// Canonical Nominatim `/search` endpoint seam (explicit-submit only, no
// autocomplete, no secret). Same env name the web layer resolves
// (VITE_NOMINATIM_SEARCH_URL); absent resolves to the public default which
// mirrors MapValidation.DEFAULT_NOMINATIM_ENDPOINT (the default value
// source). Validated natively before use with that default as fallback.
def findbackMapSearchUrl() {
    def url = System.getenv("VITE_NOMINATIM_SEARCH_URL") ?: "https://nominatim.openstreetmap.org/search"
    return url.trim()
}

android {
    namespace = "com.findback.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.findback.app"
        // Pinned NDK + CMake for the `findback_probe` capability library
        // (dlopen-only NNAPI/Vulkan/OpenCL probes). Pinned exact in
        // variables.gradle — never floating.
        ndkVersion rootProject.ext.ndkPinnedVersion
        // Release metadata is DERIVED, never duplicated: minSdk/target come
        // from rootProject.ext (variables.gradle), compileSdk likewise, and
        // versionName from apps/mobile/package.json (appVersionName below).
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Version sources (audit #29). Single source of truth is the SemVer
        // "version" in apps/mobile/package.json: versionName is generated
        // from it, never a duplicated literal. versionCode is deterministic
        // (100000 + git commit count) so every commit yields a greater
        // integer with no hand-bumping; VERSION_CODE_OVERRIDE covers
        // shallow CI clones that cannot count history.
        versionCode gitVersionCode()
        versionName appVersionName()
        resValue "string", "findback_build_git_sha", gitCommitSha()
        manifestPlaceholders = [findbackShareHost: shareLinkHostname()]
        // Native direct-reply endpoint. The Supabase URL is public (it is baked
        // into the web bundle); the publishable key is NOT needed here — the
        // reply-comment function is token-authenticated. Env override first so
        // CI/local can point at a different project.
        def nativeSupabaseUrl = System.getenv("VITE_SUPABASE_URL") ?: System.getenv("SUPABASE_URL") ?: "https://nfjhpigbsyyoaaktfaev.supabase.co"
        buildConfigField "String", "REPLY_ENDPOINT", "\"${nativeSupabaseUrl}/functions/v1/reply-comment\""
        // Google Sign-In (W0-A S1): Web/server OAuth client ID used as the
        // Credential Manager Google ID option audience. Env-provided
        // (GOOGLE_WEB_CLIENT_ID from the owner-configured Google Cloud
        // console); default empty = misconfigured → the GoogleAuthPlugin fails
        // closed (isAvailable false, signIn rejects) and never fakes success.
        // This is a public identifier, NOT a secret — and no client secret
        // exists anywhere in this path. Never hard-code a real value here.
        def googleWebClientId = System.getenv("GOOGLE_WEB_CLIENT_ID") ?: ""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
        // Keyless map style endpoint (see findbackMapStyleUrl above). Public
        // non-secret config; validated natively before use (HTTPS, non-empty,
        // non-placeholder) with the OpenFreeMap default as fallback.
        buildConfigField "String", "MAP_STYLE_URL", "\"${findbackMapStyleUrl()}\""
        // Public Nominatim contact (see findbackMapContact above). Non-secret.
        buildConfigField "String", "MAP_SEARCH_CONTACT", "\"${findbackMapContact()}\""
        // Canonical search endpoint (see findbackMapSearchUrl above).
        // Public non-secret config; validated natively before use (HTTPS,
        // non-empty) with MapValidation.DEFAULT_NOMINATIM_ENDPOINT as fallback.
        buildConfigField "String", "MAP_SEARCH_URL", "\"${findbackMapSearchUrl()}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Release signing for the beta pipeline. The workflow decodes
        // ANDROID_KEYSTORE_BASE64 to ANDROID_KEYSTORE_PATH before invoking
        // Gradle. Referenced only when ANDROID_KEYSTORE_PASSWORD is set.
        findbackRelease {
            storeFile file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "${projectDir}/release.keystore")
            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            keyAlias System.getenv("ANDROID_KEY_ALIAS")
            keyPassword System.getenv("ANDROID_KEY_PASSWORD")
        }
    }
    splits {
        abi {
            // Release-only ABI splits: one APK per supported ABI plus a
            // universal APK; the AAB (bundleRelease) is unaffected and always
            // built. Debug stays a single unsplit APK: splits enable only when
            // the Gradle invocation targets a release task. No density or
            // language splits (no matrices) — keep the artifact set small and
            // auditable.
            // NOTE: minifyEnabled/shrinkResources stay OFF (see release
            // buildType below). Enabling R8 is a separate future change with
            // its own size-measurement comparison, not a silent flip here.
            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }
    buildTypes {
        release {
            // Signed only when the release pipeline provides credentials
            // (ANDROID_KEYSTORE_PASSWORD et al). Local release builds stay
            // unsigned instead of failing on missing secrets.
            if (System.getenv("ANDROID_KEYSTORE_PASSWORD")) {
                signingConfig signingConfigs.findbackRelease
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        signeddev {
            // W0-D: device-bound dev installs. Debug behavior otherwise
            // (initWith debug); ABI splits stay OFF because the task name
            // carries no "release" (see splits above), so a single unsplit
            // APK. Signed with the CANONICAL findbackRelease keystore ONLY
            // when ALL of the existing ANDROID_KEYSTORE_* env creds are
            // present. When they are incomplete this variant stays UNSIGNED
            // and the task-graph guard at the bottom of this file refuses to
            // package it at all — it NEVER falls back to the debug signer
            // (FBX-025). No new secret paths, no committed keystore/passwords.
            initWith debug
            // Library modules (:capacitor-android,
            // :capacitor-cordova-android-plugins) ship only debug/release
            // variants: resolve their debug variant for this build type.
            matchingFallbacks = ['debug']
            if (signeddevSigningReady()) {
                signingConfig signingConfigs.findbackRelease
            } else {
                // Drop the signingConfig inherited from `initWith debug` so a
                // packaging path that ever bypassed the guard below would emit
                // an UNSIGNED apk, never a debug-signed one (FBX-025).
                signingConfig = null
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.31.6"
        }
    }
    buildFeatures {
        buildConfig = true
    }
}

// Fetch USE model task - runs before preBuild
def repoRoot = rootProject.projectDir.parentFile.parentFile.parentFile
tasks.register("fetchUseModel", Exec) {
    commandLine "node", new File(repoRoot, "scripts/fetch-use-model.mjs").absolutePath
    outputs.file(new File(projectDir, "src/main/assets/models/use/universal_sentence_encoder.tflite"))
    onlyIf { !outputs.files.singleFile.exists() }
}
tasks.named("preBuild").configure { dependsOn("fetchUseModel") }

// Fetch Needle NDK link engines (libneedle.a + needle.h per ABI) before any
// native build. Opt-in script with pinned + verified artifacts; weights are
// NEVER fetched here (runtime downloader installs them post-consent).
// The CMake bridge links the static archives, so missing engines fail the
// build loudly instead of shipping a stub.
tasks.register("fetchNeedleEngine", Exec) {
    commandLine "node", new File(repoRoot, "scripts/fetch-needle-model.mjs").absolutePath, "--engine-only"
    environment "NEEDLE_MODEL_ENABLED", "1"
    outputs.dir(new File(projectDir, "src/main/cpp/third_party/needle"))
}
tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }
    .configureEach { dependsOn("fetchNeedleEngine") }

// Fetch pinned llama.cpp lab source (v0.5.0 tarball, size+SHA verified)
// before any native build. Weights are NEVER fetched here: lab GGUF files
// install at lab time through the verified downloader, and LFM-licensed
// arms stay blocked from production distribution by the license gate.
tasks.register("fetchLlamaCpp", Exec) {
    commandLine "node", new File(repoRoot, "scripts/fetch-llama-cpp.mjs").absolutePath
    outputs.dir(new File(projectDir, "src/main/cpp/third_party/llama.cpp"))
}
tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }
    .configureEach { dependsOn("fetchLlamaCpp") }

// A direct Gradle package of stale Capacitor assets cannot bypass the web
// build gate. This checks the actual staged JS against the effective public
// config; missing or mismatched values stop APK/AAB packaging. JVM-only tests
// and other Gradle tasks do not require an installable-build environment.
tasks.register("verifyBundledClientConfig", Exec) {
    commandLine "node", new File(repoRoot, "scripts/check-mobile-build-config.mjs").absolutePath,
        "--assets", new File(projectDir, "src/main/assets/public/assets").absolutePath
}
tasks.matching { it.name in ["packageDebug", "packageRelease", "packageSigneddev", "packageDebugBundle", "packageReleaseBundle", "packageSigneddevBundle"] }
    .configureEach { dependsOn("verifyBundledClientConfig") }

// FBX-026: the signeddev path proves config + App-Links/web provenance, so a
// direct `./gradlew assembleSigneddev` can never bypass the wrapper checks.
// Same presence/shape rules as scripts/build-apk.mjs's signeddev branch; no
// network, no values in the log.
tasks.register("verifySigneddevConfig", Exec) {
    commandLine "node", new File(repoRoot, "scripts/check-signeddev-config.mjs").absolutePath,
        "--assets", new File(projectDir, "src/main/assets/public").absolutePath
}
tasks.matching { it.name in ["packageSigneddev", "packageSigneddevBundle"] }
    .configureEach { dependsOn("verifySigneddevConfig") }

// FBX-028: the RELEASE path gets the SAME public-config + App-Links provenance
// gate as signeddev. A direct `./gradlew assembleRelease` previously packaged
// a release APK with only the Supabase/share/Sentry bundle check
// (verifyBundledClientConfig) — it never asserted GOOGLE_WEB_CLIENT_ID, so a
// signed release APK could ship with Google sign-in silently disabled. This
// reuses the signeddev checker (Google web client id + map config + App-Links
// manifest + staged association) so the direct Gradle route cannot bypass the
// wrapper's release checks either. Debug/other tasks stay ungated.
tasks.register("verifyReleaseConfig", Exec) {
    commandLine "node", new File(repoRoot, "scripts/check-signeddev-config.mjs").absolutePath,
        "--assets", new File(projectDir, "src/main/assets/public").absolutePath
}
tasks.matching { it.name in ["packageRelease", "packageReleaseBundle"] }
    .configureEach { dependsOn("verifyReleaseConfig") }

// FBX-025: fail-closed packaging gate. signeddev silently fell back to the
// debug signer when ANDROID_KEYSTORE_* was incomplete; it now refuses to run
// at all before any APK is written. Guard fires for any packaging/install
// task whose name carries "signeddev" (assembleSigneddev, installSigneddev,
// packageSigneddev, ...). Configuration-only and diagnostic tasks (help,
// signingReport) stay usable so the project still resolves and can be
// inspected without signing credentials.
def signeddevTaskNames = { String name ->
    name.toLowerCase().contains("signeddev") &&
        ["assemble", "bundle", "package", "install"]
            .any { prefix -> name.toLowerCase().startsWith(prefix) }
}
gradle.taskGraph.whenReady { graph ->
    if (!signeddevSigningReady() && graph.allTasks.any { signeddevTaskNames(it.name) }) {
        throw new GradleException(
            "signeddev packaging requires the canonical signing environment " +
            "(ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, " +
            "ANDROID_KEY_PASSWORD). Failing closed instead of falling back to the " +
            "debug signer — export them, or build the debug variant.")
    }
}

// CI assertion aid: logs the versionName/versionCode the APK will carry.
tasks.register("printVersionInfo") {
    doLast {
        println("versionName=${appVersionName()}")
        println("versionCode=${gitVersionCode()}")
        println("buildGitSha=${gitCommitSha()}")
    }
}

repositories {
    mavenCentral()
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.mediapipe:tasks-text:1.0.0"
    // FCM runtime for the data-only notification service + RemoteInput reply
    // action. The Capacitor push plugin brings this transitively; depended on
    // explicitly because our own FirebaseMessagingService overrides its service.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    // Report location-services check + enable dialog (SettingsClient). The
    // Geolocation fix itself comes from @capacitor/geolocation (fused provider).
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // Keyless map renderer (MAP pivot): MapLibre Native Android, OpenGL ES
    // backend only. Pinned exact via $mapLibreVersion in variables.gradle —
    // never floating.
    implementation "org.maplibre.gl:android-sdk-opengl:$mapLibreVersion"
    // Google Sign-In (W0-A S1): Android Credential Manager + Google ID option.
    // Pinned exact — never floating. Stable 1.6.0 line (April 2026) +
    // googleid 1.2.1 (Sept 2026, carries GetGoogleIdOption incl.
    // setRequestVerifiedPhoneNumber used by GoogleAuthPlugin).
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation "androidx.exifinterface:exifinterface:$androidxExifInterfaceVersion"
    // On-device vision: LiteRT-LM Android (SmolVLM2-500M `.litertlm`).
    // GPU is selected via EngineConfig backend — no separate GPU-delegate
    // coordinate exists for the LM path; the natives ship in this AAR.
    implementation "com.google.ai.edge.litertlm:litertlm-android:$litertLmVersion"
    // Structured concurrency for the vision plugin's load/infer jobs
    // (Scope + Flow collection). Aligned with Kotlin 2.2.x.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:2.4.0"
    // Real org.json so Capacitor JSObject/JSArray serialization is exercised on
    // the JVM instead of the throwing mockable android.jar stubs.
    testImplementation "org.json:json:20240303"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        // Release artifact set: exactly the three declared ABIs. The universal
        // APK otherwise bundles every ABI present in the dependency graph
        // (e.g. 32-bit x86 from MediaPipe/Sentry), which the release verifier
        // does not advertise. Debug is untouched.
        variant.packaging.jniLibs.excludes.add("lib/x86/**")
    }
}
