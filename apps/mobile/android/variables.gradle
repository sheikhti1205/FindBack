    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    kotlinVersion = '2.4.0'
    androidxExifInterfaceVersion = '1.4.2'
    // On-device vision (SmolVLM2-500M via LiteRT-LM). Pinned exact — never
    // dynamic — so every build resolves the same AAR. Verified present on
    // Google Maven (maven-metadata: latest 0.17.1).
    // On-device vision (SmolVLM2-500M via LiteRT-LM). Pinned exact — never
    // dynamic — so every build resolves the same AAR. Verified present on
    // Google Maven (maven-metadata: latest 0.17.1).
    litertLmVersion = '0.17.1'
    coroutinesVersion = '1.10.2'
    // Keyless map renderer (MAP pivot): MapLibre Native Android, OpenGL ES
    // backend only (widest compatibility, smallest ABI weight vs the
    // multi-backend artifact). Pinned exact — never floating or dynamic — so
    // every build resolves the same AAR. Single version source: referenced as
    // $mapLibreVersion in app/build.gradle; release gates assert the pin.
    mapLibreVersion = '13.6.1'
    // Pinned NDK + CMake for `findback_probe` (see ndkVersion /
    // externalNativeBuild in app/build.gradle). Kept here so the toolchain
    // pin lives next to every other version pin.
    ndkPinnedVersion = '29.0.13113456'
    cmakePinnedVersion = '3.31.6'
}